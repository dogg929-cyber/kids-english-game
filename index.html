<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>キッズ英語ゲーム | Kids English Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== ホーム画面 ===================== -->
<section id="screen-home" class="screen active">
  <div class="home-wrap">
    <h1 class="title">
      <span class="title-star">★</span>
      キッズ えいごゲーム
      <span class="title-star">★</span>
    </h1>
    <p class="subtitle">Kids English Game — 2〜5さい向け</p>

    <div class="category-grid">
      <button class="cat-btn cat-animals" data-category="animals">
        <span class="cat-emoji">🐶</span>
        <span class="cat-label">どうぶつ<br><small>Animals</small></span>
      </button>
      <button class="cat-btn cat-colors" data-category="colors">
        <span class="cat-emoji">🌈</span>
        <span class="cat-label">いろ<br><small>Colors</small></span>
      </button>
      <button class="cat-btn cat-fruits" data-category="fruits">
        <span class="cat-emoji">🍎</span>
        <span class="cat-label">くだもの<br><small>Fruits</small></span>
      </button>
      <button class="cat-btn cat-numbers" data-category="numbers">
        <span class="cat-emoji">🔢</span>
        <span class="cat-label">すうじ<br><small>Numbers</small></span>
      </button>
    </div>

    <button id="quiz-start-btn" class="quiz-launch-btn">
      🎯 クイズであそぶ！ <span class="en">Quiz Time</span>
    </button>

    <button id="zoo-start-btn" class="quiz-launch-btn zoo-launch-btn">
      🦁 どうぶつえんへ！ <span class="en">Zoo Adventure</span>
    </button>
  </div>
</section>

<!-- ===================== フラッシュカード画面 ===================== -->
<section id="screen-cards" class="screen">
  <button class="back-btn" data-target="screen-home">← もどる</button>

  <div class="card-wrap">
    <div id="flashcard" class="flashcard">
      <div class="flashcard-emoji" id="card-emoji">🐶</div>
      <div class="flashcard-word" id="card-word">dog</div>
      <div class="flashcard-word-jp" id="card-word-jp">いぬ</div>
    </div>

    <button id="speak-btn" class="speak-btn" aria-label="はつおんをきく">
      🔊
    </button>

    <div class="nav-row">
      <button id="prev-btn" class="nav-btn">◀</button>
      <div id="progress-dots" class="progress-dots"></div>
      <button id="next-btn" class="nav-btn">▶</button>
    </div>
  </div>
</section>

<!-- ===================== クイズ画面（きく→えらぶ→はなす） ===================== -->
<section id="screen-quiz" class="screen">
  <button class="back-btn" data-target="screen-home">← もどる</button>
  <div class="quiz-score-badge">⭐️ <span id="quiz-score">0</span></div>

  <div class="quiz-wrap">

    <!-- フェーズ1: えいごをきいて、えをえらぶ -->
    <div id="quiz-question-phase" class="quiz-phase">
      <button id="quiz-replay-btn" class="quiz-replay-btn">🔊 もういちど きく</button>
      <p class="quiz-question-en" id="quiz-question-en">Where is the elephant?</p>
      <p class="quiz-question-jp" id="quiz-question-jp">ぞうさんはどこ？</p>
      <div id="quiz-options" class="quiz-options"></div>
    </div>

    <!-- フェーズ2: じぶんではなしてみよう -->
    <div id="quiz-speak-phase" class="quiz-phase" hidden>
      <div class="speak-emoji" id="speak-phase-emoji">🐘</div>
      <div class="mic-icon" id="mic-icon">🎤</div>
      <p class="speak-prompt-sub">Can you say</p>
      <p class="speak-prompt-word" id="speak-target-word">ELEPHANT</p>
      <p class="mic-status" id="mic-status">きいているよ…</p>

      <div class="speak-actions">
        <button id="hear-example-btn" class="quiz-replay-btn">🔊 おてほんを きく</button>
      </div>
      <button id="skip-btn" class="skip-btn">つぎへ →</button>
    </div>

  </div>
</section>

<!-- ===================== 結果画面 ===================== -->
<section id="screen-result" class="screen">
  <div class="result-wrap">
    <div class="result-emoji">🏆</div>
    <h2>やったね！</h2>
    <p class="result-score">スコア: <span id="final-score">0</span> / <span id="final-total">0</span></p>
    <button id="result-again-btn" class="quiz-launch-btn">もういちど</button>
    <button id="result-home-btn" class="back-btn-solid">ホームへ</button>
  </div>
</section>

<!-- ===================== Zoo Adventure（動物園さがしゲーム） ===================== -->
<section id="screen-zoo" class="screen zoo-screen">
  <button class="back-btn" data-target="screen-home">← もどる</button>
  <div class="quiz-score-badge zoo-score-badge">⭐️ <span id="zoo-score">0</span></div>

  <!-- 背景の風景（装飾のみ・タップ不可） -->
  <div class="zoo-scenery" aria-hidden="true">
    <div class="zoo-sun">☀️</div>
    <span class="zoo-cloud zoo-cloud-1">☁️</span>
    <span class="zoo-cloud zoo-cloud-2">☁️</span>
    <div class="zoo-tree zoo-tree-left">🌳</div>
    <div class="zoo-tree zoo-tree-right">🌳</div>
    <div class="zoo-pond">🐟</div>
    <div class="zoo-rock zoo-rock-1">🪨</div>
    <div class="zoo-rock zoo-rock-2">🪨</div>
    <div class="zoo-grass"></div>
    <div class="zoo-fence"></div>
  </div>

  <!-- 質問バナー -->
  <div class="zoo-question-banner">
    <button id="zoo-replay-btn" class="zoo-replay-btn" aria-label="もういちど きく">🔊</button>
    <div class="zoo-question-text">
      <p class="quiz-question-en" id="zoo-question-en">Where is the cat?</p>
      <p class="quiz-question-jp" id="zoo-question-jp">ねこはどこ？</p>
    </div>
  </div>

  <!-- 動物たちがうごきまわるエリア -->
  <div id="zoo-play-area" class="zoo-play-area"></div>

  <!-- 発音練習オーバーレイ -->
  <div id="zoo-speak-overlay" class="zoo-speak-overlay" hidden>
    <div class="zoo-speak-card">
      <div class="speak-emoji" id="zoo-speak-emoji">🐱</div>
      <div class="mic-icon" id="zoo-mic-icon">🎤</div>
      <p class="speak-prompt-sub">Can you say</p>
      <p class="speak-prompt-word" id="zoo-speak-word">CAT</p>
      <p class="mic-status" id="zoo-mic-status"></p>
      <div class="speak-actions">
        <button id="zoo-hear-example-btn" class="quiz-replay-btn">🔊 おてほんを きく</button>
      </div>
      <button id="zoo-skip-btn" class="skip-btn">つぎへ →</button>
    </div>
  </div>

  <!-- ラウンド終了オーバーレイ -->
  <div id="zoo-round-complete" class="zoo-speak-overlay" hidden>
    <div class="zoo-speak-card">
      <div class="speak-emoji">🎉</div>
      <p class="speak-prompt-sub" style="font-size:20px;">やったね！</p>
      <p class="mic-status" id="zoo-round-score"></p>
      <button id="zoo-again-btn" class="quiz-launch-btn" style="margin-top:14px;">もういちど</button>
      <button id="zoo-home-btn" class="back-btn-solid" style="margin-top:12px;">ホームへ</button>
    </div>
  </div>
</section>

<div id="confetti-layer" aria-hidden="true"></div>

<script src="speech.js"></script>
<script src="app.js"></script>
<script src="zoo.js"></script>
</body>
</html>
